<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Address Tracker</title>

    <!-- Fuente Rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS (mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA: título + buscador -->
    <header class="header">
        <h1 class="header__title">IP Address Tracker</h1>

        <form class="search" id="search-form">
            <input
                type="text"
                class="search__input"
                id="search-input"
                placeholder="Search for any IP address or domain"
                autocomplete="off"
            >
            <button type="submit" class="search__button" aria-label="Search">
                <img src="images/icon-arrow.svg" alt="">
            </button>
        </form>
    </header>

    <!-- TARJETA DE DATOS -->
    <section class="card" id="card">
        <div class="card__item">
            <h2 class="card__label">IP ADDRESS</h2>
            <p class="card__value" id="ip">--</p>
        </div>

        <div class="card__item">
            <h2 class="card__label">LOCATION</h2>
            <p class="card__value" id="location">--</p>
        </div>

        <div class="card__item">
            <h2 class="card__label">TIMEZONE</h2>
            <p class="card__value" id="timezone">--</p>
        </div>

        <div class="card__item">
            <h2 class="card__label">ISP</h2>
            <p class="card__value" id="isp">--</p>
        </div>
    </section>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- ATRIBUCIÓN -->
    <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        Coded by <a href="#">javierSuarez83</a>.
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Nuestro JS -->
    <script src="app.js"></script>
</body>
</html>
